# Keeps the static HTML of the listings (what Google indexes) in sync with Pararius Office.
#
# Visitors always see the live offer: the browser reads the listings API worker (api-worker/),
# which holds the Pararius Office key and refreshes every 5 minutes. This workflow only
# rebuilds the static pages when the offer changed, so search engines see it too.
# Every 30 minutes (daytime) it compares the API version with /aanbod-versie.txt on the live
# site. Does nothing until the Cloudflare secrets are set. No Pararius key needed here.
#
# Settings → Secrets and variables → Actions:
#   Secrets:   CLOUDFLARE_API_TOKEN    Cloudflare token with "Edit Cloudflare Workers"
#              CLOUDFLARE_ACCOUNT_ID   Cloudflare account id
#   Variables: LISTINGS_API_URL        optional (default https://karensrealestate-api.boy-grabacio.workers.dev)
#              LIVE_URL                optional: where the site runs now (default https://www.karensrealestate.nl)
#
# Run it by hand: Actions → "Woningaanbod bijwerken" → Run workflow (tick "force" to always deploy).
name: Woningaanbod bijwerken

on:
  schedule:
    - cron: '*/30 5-21 * * *'   # every 30 min, 06:00–23:00 Dutch time
  workflow_dispatch:
    inputs:
      force:
        description: 'Altijd opnieuw bouwen en deployen'
        type: boolean
        default: false

concurrency:
  group: woningaanbod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LISTINGS_API_URL: ${{ vars.LISTINGS_API_URL }}
      LIVE_URL: ${{ vars.LIVE_URL }}
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Is de koppeling ingesteld?
        id: gate
        run: |
          if [ "$HAS_CLOUDFLARE" != "true" ]; then
            echo "::notice::Cloudflare-secrets ontbreken nog. Niets te doen."
            echo "active=false" >> "$GITHUB_OUTPUT"
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.active == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.active == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Afhankelijkheden installeren
        if: steps.gate.outputs.active == 'true'
        run: npm ci

      - name: Is het aanbod gewijzigd?
        id: check
        if: steps.gate.outputs.active == 'true'
        run: npm run feed:check

      - name: Site bouwen
        if: steps.gate.outputs.active == 'true' && (steps.check.outputs.changed == 'true' || inputs.force)
        run: npm run build:cf

      - name: Deployen naar Cloudflare
        if: steps.gate.outputs.active == 'true' && (steps.check.outputs.changed == 'true' || inputs.force)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy
